# Goose Configuration
# This configuration sets up Goose with Anthropic's Claude models for AI-assisted development

GOOSE_PROVIDER: anthropic
GOOSE_MODEL: claude-sonnet-4-20250514

GOOSE_PLANNER_PROVIDER: anthropic
GOOSE_PLANNER_MODEL: claude-opus-4-20250514

extensions:
  developer:
    bundled: true
    enabled: true
    name: developer
    timeout: 300
    type: builtin