name: Nightly Project Container Security Scan

on:
  schedule:
    # Run nightly at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scan:
    uses: ./.github/workflows/reusable-nightly-scan.yml
    with:
      image-name: ${{ github.repository }}/project-container
      trivyignores-path: project-container/.trivyignore
      display-name: Project Container
    secrets: inherit
