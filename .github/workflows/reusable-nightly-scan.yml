name: Reusable Nightly Security Scan

# Reusable workflow for nightly container security scanning.
# Scans a container image for vulnerabilities and creates a GitHub issue on failure.

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Image name without registry (e.g., rise8-us/xpai/firewall-manager)'
        required: true
        type: string
      trivyignores-path:
        description: 'Path to .trivyignore file'
        required: true
        type: string
      display-name:
        description: 'Human-readable name for issue titles (e.g., "Firewall Manager")'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Security scan
        id: scan
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.REGISTRY }}/${{ inputs.image-name }}:latest
          trivyignores-path: ${{ inputs.trivyignores-path }}

      - name: Record scan result
        if: always()
        run: |
          if [ "${{ steps.scan.outcome }}" = "success" ]; then
            echo "✅ Security scan passed for ${{ inputs.display-name }}"
          else
            echo "❌ Security scan failed for ${{ inputs.display-name }}"
          fi

  notify-on-failure:
    needs: [security-scan]
    runs-on: ubuntu-latest
    if: always() && needs.security-scan.result == 'failure'
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create failure notification issue
        uses: ./.github/actions/create-scan-failure-issue
        with:
          image-name: ${{ env.REGISTRY }}/${{ inputs.image-name }}
          display-name: ${{ inputs.display-name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
