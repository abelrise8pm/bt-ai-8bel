name: Nightly AI Assistant Container Security Scan

on:
  schedule:
    # Run nightly at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/xpai/ai-assistant-home

jobs:
  nightly-security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        id: scan
        # Using aquasecurity/trivy-action@0.28.0 (commit 915b19b)
        # Pinned to specific commit for security and reproducibility
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: 'ai-assistant-container/.trivyignore'
        env:
          TRIVY_CACHE_BACKEND: memory


      - name: Record scan result
        if: always()
        run: |
          if [ "${{ steps.scan.outcome }}" = "success" ]; then
            echo "✅ Security scan passed for latest image"
          else
            echo "❌ Security scan failed for latest image"
          fi

  notify-on-failure:
    needs: [nightly-security-scan]
    runs-on: ubuntu-latest
    if: always() && needs.nightly-security-scan.result == 'failure'
    permissions:
      contents: read
      issues: write

    steps:
      - name: Create failure notification issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().split('T')[0];
            const workflowUrl = context.payload.repository.html_url + '/actions/runs/' + context.runId;
            const repoUrl = context.payload.repository.html_url;
            const owner = context.repo.owner;

            // Build issue body using simple string concatenation to avoid template literal complexity
            const issueBody = [
              '## Nightly Security Scan Failure',
              '',
              'The nightly security scan for AI assistant container images has detected vulnerabilities.',
              '',
              '**Workflow Run:** ' + workflowUrl,
              '**Date:** ' + new Date().toISOString(),
              '**Scan Time:** ' + new Date().toLocaleString('en-US', { timeZone: 'UTC' }) + ' UTC',
              '',
              '### Scan Results Summary:',
              'The latest production image failed security scanning with CRITICAL or HIGH severity vulnerabilities.',
              '',
              '### Failed Image:',
              '`:latest` tag from the container registry',
              '',
              '### Next Steps:',
              '1. 🔍 **Review the Security tab** for detailed vulnerability reports',
              '2. 📊 **Check the workflow logs** for specific scan results',
              '3. 🔄 **Update dependencies** or base images to address vulnerabilities',
              '4. 🏗️ **Rebuild and redeploy** containers with security fixes',
              '5. ✅ **Re-run this workflow** once issues are resolved',
              '',
              '### Security Resources:',
              '- [GitHub Security Advisories](' + repoUrl + '/security/advisories)',
              '- [Container Registry Packages](https://github.com/orgs/' + owner + '/packages)',
              '- [Trivy Documentation](https://aquasecurity.github.io/trivy/)',
              '',
              '**Priority:** High - Security vulnerabilities detected in production images',
              '',
              '@mikegehard-rise8 please investigate this security scan failure.'
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Nightly AI Assistant Container Security Scan Failed - ' + today,
              body: issueBody,
              assignees: ['mikegehard-rise8'],
              labels: ['security', 'container', 'nightly', 'vulnerability']
            });

            console.log('Created issue #' + issue.data.number + ': ' + issue.data.html_url);
