name: Nightly AI Assistant Container Security Scan

on:
  schedule:
    # Run nightly at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scan:
    uses: ./.github/workflows/reusable-nightly-scan.yml
    with:
      image-name: ${{ github.repository_owner }}/xpai/ai-assistant-home
      trivyignores-path: image/.trivyignore
      display-name: AI Assistant Container
    secrets: inherit
