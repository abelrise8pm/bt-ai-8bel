name: Build and Publish AI Assistant Base Container

on:
  push:
    branches: [main]
    paths:
      - 'image/Dockerfile'
      - 'image/src/**'
      - 'image/scripts/test.sh'
      - 'image/.trivyignore'
      - '.github/workflows/build-ai-assistant-container.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'image/Dockerfile'
      - 'image/src/**'
      - 'image/scripts/test.sh'
      - 'image/.trivyignore'
      - '.github/workflows/build-ai-assistant-container.yml'
      - '.github/actions/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/xpai/ai-assistant-home

jobs:
  build-test-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      scan-passed: ${{ steps.scan.conclusion == 'success' }}
      test-passed: ${{ steps.test.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup container build environment
        id: setup
        uses: ./.github/actions/setup-container-build
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      # Build for both AMD64 (GitHub runners, Intel Macs) and ARM64 (Apple Silicon Macs)
      # AMD64 listed first as it's the CI priority architecture
      - name: Build and push staging image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./image
          file: ./image/Dockerfile
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          labels: ${{ steps.setup.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: true

      # Explicitly pull with --platform to ensure correct architecture variant
      - name: Test container functionality
        id: test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd image
          # Explicitly pull AMD64 variant to ensure we test the correct architecture
          docker pull --platform linux/amd64 "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}"
          # Verify we got the correct architecture
          ARCH=$(docker inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}" --format '{{.Architecture}}')
          echo "Pulled image architecture: $ARCH"
          if [ "$ARCH" != "amd64" ]; then
            echo "❌ ERROR: Expected amd64 architecture but got $ARCH"
            exit 1
          fi
          CONTAINER_RUNTIME=docker IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}" ./scripts/test.sh

      - name: Security scan
        id: scan
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          trivyignores-path: 'image/.trivyignore'

      - name: Promote staging image to production tags
        if: steps.test.conclusion == 'success' && steps.scan.conclusion == 'success'
        run: |
          # Promote the tested staging image to production tags
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Main branch push: add both sha and latest tags (PROMOTED)
            docker buildx imagetools create \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }} \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            echo "✅ Promoted to production: ${{ github.sha }} (tagged with sha and latest)"
          else
            # PR or other branch: keep only staging tag (NOT PROMOTED)
            echo "ℹ️ PR/branch build - keeping only staging tag, not promoting to production"
          fi

