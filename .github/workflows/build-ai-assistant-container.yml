name: Build and Publish AI Assistant Base Container

on:
  push:
    branches: [main]
    paths:
      - 'ai-assistant-container/Dockerfile'
      - 'ai-assistant-container/src/**'
      - 'ai-assistant-container/scripts/test.sh'
      - 'ai-assistant-container/.trivyignore'
      - '.github/workflows/build-ai-assistant-container.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-assistant-container/Dockerfile'
      - 'ai-assistant-container/src/**'
      - 'ai-assistant-container/scripts/test.sh'
      - 'ai-assistant-container/.trivyignore'
      - '.github/workflows/build-ai-assistant-container.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/xpai/ai-assistant-home

jobs:
  build-test-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      scan-passed: ${{ steps.scan.conclusion == 'success' }}
      test-passed: ${{ steps.test.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup container build environment
        id: setup
        uses: ./.github/actions/setup-container-build
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./ai-assistant-container
          file: ./ai-assistant-container/Dockerfile
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          labels: ${{ steps.setup.outputs.labels }}
          platforms: linux/arm64,linux/amd64
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Test container functionality
        id: test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PACKAGE_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ai-assistant-container
          # Test using the staging image (AMD64 variant on GitHub runners)
          export DOCKER_DEFAULT_PLATFORM=linux/amd64
          CONTAINER_RUNTIME=docker IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}" ./scripts/test.sh

      - name: Security scan
        id: scan
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          trivyignores-path: 'ai-assistant-container/.trivyignore'

      - name: Promote staging image to production tags
        if: steps.test.conclusion == 'success' && steps.scan.conclusion == 'success'
        run: |
          # Promote the tested staging image to production tags
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Main branch push: add both sha and latest tags (PROMOTED)
            docker buildx imagetools create \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }} \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            echo "✅ Promoted to production: ${{ github.sha }} (tagged with sha and latest)"
          else
            # PR or other branch: keep only staging tag (NOT PROMOTED)
            echo "ℹ️ PR/branch build - keeping only staging tag, not promoting to production"
          fi

      - name: Clean up container registry
        if: steps.test.conclusion == 'success' && steps.scan.conclusion == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NOTE: Cleanup now runs on PRs for testing - RETURN TO MAIN-ONLY BEFORE ENABLING DELETE API CALLS
          # Only run cleanup after successful promotion to avoid removing images during failed deployments
          if ([ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]) || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🧹 Starting container registry cleanup..."

            # Get all package versions with metadata first
            echo "📦 Fetching all package versions..."
            PACKAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | sed 's|^${{ github.repository_owner }}/||' | sed 's|/|%2F|g')
            if ! ALL_VERSIONS=$(gh api /orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions --paginate 2>/dev/null); then
              echo "⚠️ Package not found or API error, skipping cleanup"
              exit 0
            fi

            # Pre-compute common data extractions to avoid redundant jq processing
            echo "🔧 Pre-processing image data..."

            # Extract basic image info for debugging (used multiple times)
            ALL_IMAGES_DEBUG=$(echo "$ALL_VERSIONS" | jq -r '.[] | "ID: \(.id), Created: \(.created_at), Tags: \(.metadata.container.tags // [] | join(", "))"')

            # Extract multi-arch manifest details for debugging
            MULTIARCH_DEBUG=$(echo "$ALL_VERSIONS" | jq -r '.[] | "ID: \(.id) - Created: \(.created_at) - Tags: \(.metadata.container.tags // [] | sort | join(",")) - Size: \(.metadata.container.digest // "unknown")"')

            # Extract staging image IDs (used multiple times)
            STAGING_VERSION_IDS=$(echo "$ALL_VERSIONS" | jq -r '.[] | select(.metadata.container.tags[]? == "staging-${{ github.sha }}") | .id')

            # Extract grouped images debug info
            GROUPED_IMAGES_DEBUG=$(echo "$ALL_VERSIONS" | jq -r 'group_by(.metadata.container.tags // [] | sort) | .[] | "TagSet: \(.[0].metadata.container.tags // [] | sort | join(",")) - Count: \(length) - IDs: \([.[].id] | join(","))"')

            # Extract promotion criteria debug info
            PROMOTION_DEBUG=$(echo "$ALL_VERSIONS" | jq -r '
              .[] |
              "ID: \(.id) - Tags: \(.metadata.container.tags // [] | join(", ")) - " +
              "HasBuildcache: \((.metadata.container.tags[]? // "") == "buildcache") - " +
              "HasSHA: \([.metadata.container.tags[]? // "" | test("^[a-f0-9]{40}$")] | any) - " +
              "IsPromoted: \((.metadata.container.tags[]? // "") != "buildcache" and ([.metadata.container.tags[]? // "" | test("^[a-f0-9]{40}$")] | any))"
            ')

            # Show all images first for debugging
            echo "🔍 DEBUG: All images in registry:"
            echo "$ALL_IMAGES_DEBUG" | head -20

            # Debug: Show multi-architecture manifest details
            echo "🏗️ DEBUG: Multi-architecture manifest analysis:"
            echo "$MULTIARCH_DEBUG" | head -20

            # Debug: Group images by identical tag sets to identify multi-arch duplicates
            echo "🔍 DEBUG: Images grouped by identical tag sets:"
            echo "$GROUPED_IMAGES_DEBUG" | head -10

            # Find promoted images FIRST (those with commit SHA tags but no staging/buildcache prefixes)
            # Safeguard: Ensure we have valid JSON before processing
            if ! echo "$ALL_VERSIONS" | jq empty 2>/dev/null; then
              echo "❌ ERROR: Invalid JSON response from API, aborting cleanup"
              exit 1
            fi

            # Debug: Show which images match promotion criteria (simplified: has SHA tag = promoted)
            echo "🔍 DEBUG: Checking promotion criteria for each image:"
            echo "$PROMOTION_DEBUG" | head -10

            # Group images by identical tag sets (multi-arch manifests share same tags)
            echo "🏗️ DEBUG: Creating logical image groups from multi-arch manifests..."
            LOGICAL_IMAGE_GROUPS=$(echo "$ALL_VERSIONS" | jq '
              group_by(.metadata.container.tags // [] | sort) |
              map({
                tag_set: (.[0].metadata.container.tags // [] | sort),
                manifests: .,
                earliest_created: (map(.created_at) | min),
                latest_created: (map(.created_at) | max),
                manifest_ids: [.[].id],
                manifest_count: length
              }) |
              sort_by(.latest_created) | reverse
            ')

            echo "🔍 DEBUG: Logical image groups found:"
            echo "$LOGICAL_IMAGE_GROUPS" | jq -r '.[] | "TagSet: \(.tag_set | join(",")) - Manifests: \(.manifest_count) - IDs: \(.manifest_ids | join(",")) - Created: \(.latest_created)"' | head -10

            # Find promoted logical image groups (those with SHA tags from main branch builds)
            PROMOTED_GROUPS=$(echo "$LOGICAL_IMAGE_GROUPS" | jq '
              [.[] | select(
                (.tag_set // [] | index("buildcache") == null) and
                ([.tag_set[]? // "" | test("^[a-f0-9]{40}$")] | any)
              )]
            ')

            # Handle empty PROMOTED_GROUPS to avoid jq errors when no promoted images exist
            if [ -n "$PROMOTED_GROUPS" ] && [ "$PROMOTED_GROUPS" != "null" ] && [ "$PROMOTED_GROUPS" != "" ]; then
              PROMOTED_VERSIONS=$(echo "$PROMOTED_GROUPS" | jq '. | sort_by(.latest_created) | reverse')
            else
              PROMOTED_VERSIONS="[]"
            fi

            # Keep only top 5 promoted images
            KEEP_COUNT=5
            PROMOTED_COUNT=$(echo "$PROMOTED_VERSIONS" | jq 'length')
            echo "📊 Found $PROMOTED_COUNT promoted image groups, keeping latest $KEEP_COUNT"

            # Debug: Show the promoted image groups that were found
            echo "🔍 DEBUG: Promoted image groups found (sorted by creation time):"
            echo "$PROMOTED_VERSIONS" | jq -r '.[] | "TagSet: \(.tag_set | join(",")) - Manifests: \(.manifest_count) - IDs: \(.manifest_ids | join(",")) - Created: \(.latest_created)"'

            if [ "$PROMOTED_COUNT" -gt 0 ]; then
              # Edge case: If we have fewer than KEEP_COUNT images, keep all of them
              ACTUAL_KEEP_COUNT=$([ "$PROMOTED_COUNT" -lt "$KEEP_COUNT" ] && echo "$PROMOTED_COUNT" || echo "$KEEP_COUNT")
              echo "📋 Keeping $ACTUAL_KEEP_COUNT promoted images"

              # Get ALL manifest IDs from the groups to keep (top N most recent groups)
              KEEP_IDS=$(echo "$PROMOTED_VERSIONS" | jq -r ".[0:$ACTUAL_KEEP_COUNT] | .[].manifest_ids[]")

              # Debug: Show which image groups will be kept
              echo "🔍 DEBUG: Image groups to KEEP:"
              echo "$PROMOTED_VERSIONS" | jq -r '.[0:'"$ACTUAL_KEEP_COUNT"'] | .[] | "KEEP GROUP - TagSet: \(.tag_set | join(", ")) - Manifests: \(.manifest_count) - IDs: \(.manifest_ids | join(", ")) - Created: \(.latest_created)"'

              # Safeguard: Ensure we have at least one image to keep
              if [ -z "$KEEP_IDS" ]; then
                echo "❌ ERROR: No promoted images found to keep, aborting cleanup to prevent deleting all images"
                exit 1
              fi

              # Get the most recent promoted image group for latest tag management
              LATEST_GROUP_IDS=$(echo "$PROMOTED_VERSIONS" | jq -r '.[0].manifest_ids | join(",")')
              LATEST_SHA=$(echo "$PROMOTED_VERSIONS" | jq -r '.[0].tag_set[] | select(test("^[a-f0-9]{40}$"))')

              # Safeguard: Ensure we have a valid SHA for the latest image
              if [ -z "$LATEST_SHA" ]; then
                echo "⚠️ WARNING: Could not find SHA tag for latest promoted image group, skipping latest tag update"
              else
                echo "🏷️ Most recent promoted image group: IDs [$LATEST_GROUP_IDS] (SHA: $LATEST_SHA)"
              fi

              # Remove all non-promoted images and old promoted images
              echo "🗑️ Removing old and non-promoted images..."
              # Note: STAGING_VERSION_IDS already pre-computed above

              # Pre-compute deletion candidates to avoid redundant filtering
              KEEP_IDS_JSON=$(echo "$KEEP_IDS" | jq -R . | jq -s .)
              STAGING_IDS_JSON=$(echo "$STAGING_VERSION_IDS" | jq -R . | jq -s .)

              DELETE_IDS=$(echo "$ALL_VERSIONS" | jq -r --argjson keep_ids "$KEEP_IDS_JSON" --argjson staging_ids "$STAGING_IDS_JSON" '
                .[]
                | select(
                    (.id as $id | $keep_ids | index(($id | tostring)) == null) and
                    (.id as $id | $staging_ids | index(($id | tostring)) == null)
                  )
                | .id
              ')

              # Debug: Show all images that will be deleted with their details
              echo "🔍 DEBUG: Images that will be DELETED (excluding staging and kept images):"
              echo "$ALL_VERSIONS" | jq -r --argjson keep_ids "$KEEP_IDS_JSON" --argjson staging_ids "$STAGING_IDS_JSON" '
                .[]
                | select(
                    (.id as $id | $keep_ids | index(($id | tostring)) == null) and
                    (.id as $id | $staging_ids | index(($id | tostring)) == null)
                  )
                | "DELETE - ID: \(.id), Created: \(.created_at), Tags: \(.metadata.container.tags // [] | join(", "))"
              ' | head -10

              # Clean up staging images separately FIRST (only if they're not promoted images)
              if [ -n "$STAGING_VERSION_IDS" ] && [ "$STAGING_VERSION_IDS" != "" ]; then
                echo "🔍 DEBUG: Found staging image IDs: $(echo "$STAGING_VERSION_IDS" | tr '\n' ',' | sed 's/,$//')"

                # Check if any staging images are in the keep list (promoted)
                STAGING_PROMOTED=false
                while read -r staging_id; do
                  [ -n "$staging_id" ] || continue
                  if echo "$KEEP_IDS" | grep -q "^$staging_id$"; then
                    echo "ℹ️ Staging image $staging_id is promoted, keeping it"
                    STAGING_PROMOTED=true
                    break
                  fi
                done <<< "$STAGING_VERSION_IDS"

                if [ "$STAGING_PROMOTED" = "false" ]; then
                  echo "🗑️ Would clean up staging images:"
                  echo "$STAGING_VERSION_IDS" | while read -r staging_id; do
                    [ -n "$staging_id" ] || continue
                    # Show details of the staging image using pre-computed debug info
                    echo "$ALL_VERSIONS" | jq -c --arg id "$staging_id" '.[] | select(.id == ($id|tonumber))' | sed 's/^/STAGING DELETE - /'
                    echo "DEBUG: Would run: gh api --method DELETE /orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions/$staging_id"
                  done
                fi
              else
                echo "ℹ️ No staging images to clean up"
              fi

              # Safeguard: Show what will be deleted before proceeding
              DELETE_COUNT=$(echo "$DELETE_IDS" | wc -l)

              # Critical safeguard: Don't delete more than 1000 versions at once
              # NOTE: Temporarily increased from 50 to 1000 to handle backlog of accumulated versions
              # TODO: Reduce back to 50 when logging-only mode is removed and actual deletions are enabled
              if [ "$DELETE_COUNT" -gt 1000 ]; then
                echo "⚠️ WARNING: Attempted to delete $DELETE_COUNT versions (limit: 1000)"
                echo "ℹ️ This suggests a logic error. Aborting cleanup to prevent accidental mass deletion."
                exit 1
              fi

              if [ -n "$DELETE_IDS" ] && [ "$DELETE_COUNT" -gt 0 ]; then
                echo "🗑️ Would delete $DELETE_COUNT versions"
                echo "$DELETE_IDS" | while read -r version_id; do
                  [ -n "$version_id" ] || continue
                  echo "🗑️ Would delete version: $version_id"
                  echo "DEBUG: Would run: gh api --method DELETE /orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions/$version_id"
                done
              else
                echo "ℹ️ No versions to delete"
              fi

              # Ensure latest tag points to most recent promoted image
              if [ -n "$LATEST_SHA" ]; then
                echo "🏷️ Ensuring latest tag points to most recent promoted image ($LATEST_SHA)..."
                docker buildx imagetools create \
                  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$LATEST_SHA \
                  --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || echo "⚠️ WARNING: Failed to update latest tag"
              fi
            else
              echo "ℹ️ No promoted images found, skipping cleanup"
            fi

            # Final verification
            echo "✅ Final registry state:"
            gh api /orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions --jq '.[] | {id: .id, tags: .metadata.container.tags, created_at: .created_at}' | head -20
          else
            echo "ℹ️ Skipping cleanup - not a main branch push or tests/scan failed"
          fi
