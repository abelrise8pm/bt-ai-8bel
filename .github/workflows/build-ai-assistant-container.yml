name: Build and Publish AI Assistant Base Container

on:
  push:
    branches: [main]
    paths:
      - 'ai-assistant-container/Dockerfile'
      - 'ai-assistant-container/src/**'
      - 'ai-assistant-container/scripts/test.sh'
      - 'ai-assistant-container/.trivyignore'
      - '.github/workflows/build-ai-assistant-container.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-assistant-container/Dockerfile'
      - 'ai-assistant-container/src/**'
      - 'ai-assistant-container/scripts/test.sh'
      - 'ai-assistant-container/.trivyignore'
      - '.github/workflows/build-ai-assistant-container.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/xpai/ai-assistant-home

jobs:
  build-test-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      scan-passed: ${{ steps.scan.conclusion == 'success' }}
      test-passed: ${{ steps.test.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push staging image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./ai-assistant-container
          file: ./ai-assistant-container/Dockerfile
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64,linux/amd64
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Test container functionality
        id: test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PACKAGE_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ai-assistant-container
          # Test using the staging image (AMD64 variant on GitHub runners)
          export DOCKER_DEFAULT_PLATFORM=linux/amd64
          CONTAINER_RUNTIME=docker IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}" ./scripts/test.sh

      - name: Run Trivy vulnerability scanner
        id: scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: 'ai-assistant-container/.trivyignore'
        env:
          TRIVY_CACHE_BACKEND: memory

      - name: Promote staging image to production tags
        if: steps.test.conclusion == 'success' && steps.scan.conclusion == 'success'
        run: |
          # Promote the tested staging image to production tags
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Main branch push: add both sha and latest tags
            docker buildx imagetools create \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }} \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          else
            # PR or other branch: only add sha tag
            docker buildx imagetools create \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }} \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          fi

      - name: Clean up container registry
        if: steps.test.conclusion == 'success' && steps.scan.conclusion == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only run cleanup after successful promotion to avoid removing images during failed deployments
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "🧹 Starting container registry cleanup..."

            # Get all package versions with metadata first
            echo "📦 Fetching all package versions..."
            PACKAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | sed 's|^${{ github.repository_owner }}/||' | sed 's|/|%2F|g')
            if ! ALL_VERSIONS=$(gh api /orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions --paginate 2>/dev/null); then
              echo "⚠️ Package not found or API error, skipping cleanup"
              exit 0
            fi

            # Find promoted images FIRST (those with commit SHA tags but no staging/buildcache prefixes)
            # Safeguard: Ensure we have valid JSON before processing
            if ! echo "$ALL_VERSIONS" | jq empty 2>/dev/null; then
              echo "❌ ERROR: Invalid JSON response from API, aborting cleanup"
              exit 1
            fi

            PROMOTED_VERSIONS=$(echo "$ALL_VERSIONS" | jq -r '
              .[]
              | select(
                  (.metadata.container.tags[]? // "") != "buildcache" and
                  (.metadata.container.tags[]? // "") != "staging" and
                  ((.metadata.container.tags[]? // "") | test("^staging-")) == false and
                  ([.metadata.container.tags[]? // "" | test("^[a-f0-9]{40}$")] | any)
                )
              | {id: .id, created_at: .created_at, tags: .metadata.container.tags}
            ' | jq -s '. | sort_by(.created_at) | reverse')

            # Keep only top 5 promoted images
            KEEP_COUNT=5
            PROMOTED_COUNT=$(echo "$PROMOTED_VERSIONS" | jq 'length')
            echo "📊 Found $PROMOTED_COUNT promoted images, keeping latest $KEEP_COUNT"

            if [ "$PROMOTED_COUNT" -gt 0 ]; then
              # Edge case: If we have fewer than KEEP_COUNT images, keep all of them
              ACTUAL_KEEP_COUNT=$([ "$PROMOTED_COUNT" -lt "$KEEP_COUNT" ] && echo "$PROMOTED_COUNT" || echo "$KEEP_COUNT")
              echo "📋 Keeping $ACTUAL_KEEP_COUNT promoted images"

              # Get IDs of images to keep (top N most recent)
              KEEP_IDS=$(echo "$PROMOTED_VERSIONS" | jq -r ".[0:$ACTUAL_KEEP_COUNT] | .[].id")

              # Safeguard: Ensure we have at least one image to keep
              if [ -z "$KEEP_IDS" ]; then
                echo "❌ ERROR: No promoted images found to keep, aborting cleanup to prevent deleting all images"
                exit 1
              fi

              # Get the most recent promoted image ID for latest tag management
              LATEST_ID=$(echo "$PROMOTED_VERSIONS" | jq -r '.[0].id')
              LATEST_SHA=$(echo "$PROMOTED_VERSIONS" | jq -r '.[0].tags[] | select(test("^[a-f0-9]{40}$"))')

              # Safeguard: Ensure we have a valid SHA for the latest image
              if [ -z "$LATEST_SHA" ]; then
                echo "⚠️ WARNING: Could not find SHA tag for latest promoted image, skipping latest tag update"
              else
                echo "🏷️ Most recent promoted image: $LATEST_ID (SHA: $LATEST_SHA)"
              fi

              # Remove all non-promoted images and old promoted images
              echo "🗑️ Removing old and non-promoted images..."
              # Get staging image ID to exclude it from deletions
              STAGING_VERSION_ID=$(echo "$ALL_VERSIONS" | jq -r '.[] | select(.metadata.container.tags[]? == "staging-${{ github.sha }}") | .id' | head -1)

              DELETE_IDS=$(echo "$ALL_VERSIONS" | jq -r --argjson keep_ids "$(echo "$KEEP_IDS" | jq -R . | jq -s .)" --arg staging_id "$STAGING_VERSION_ID" '
                .[]
                | select(
                    (.id as $id | $keep_ids | index(($id | tostring)) == null) and
                    (.id != ($staging_id | tonumber))
                  )
                | .id
              ')

              # Clean up staging image separately FIRST (only if it's not a promoted image)
              if [ -n "$STAGING_VERSION_ID" ] && [ "$STAGING_VERSION_ID" != "null" ]; then
                # Check if staging image is also in the keep list (promoted)
                if echo "$KEEP_IDS" | grep -q "^$STAGING_VERSION_ID$"; then
                  echo "ℹ️ Staging image $STAGING_VERSION_ID is promoted, keeping it"
                else
                  echo "🗑️ Would clean up staging image: $STAGING_VERSION_ID"
                  echo "DEBUG: Would run: gh api --method DELETE /orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions/$STAGING_VERSION_ID"
                fi
              else
                echo "ℹ️ No staging image to clean up"
              fi

              # Safeguard: Show what will be deleted before proceeding
              DELETE_COUNT=$(echo "$DELETE_IDS" | wc -l)

              # Critical safeguard: Don't delete more than 70 versions at once
              # NOTE: Temporarily increased from 50 to 70 to handle backlog of accumulated versions
              # TODO: Reduce back to 50 when logging-only mode is removed and actual deletions are enabled
              if [ "$DELETE_COUNT" -gt 70 ]; then
                echo "⚠️ WARNING: Attempted to delete $DELETE_COUNT versions (limit: 70)"
                echo "ℹ️ This suggests a logic error. Aborting cleanup to prevent accidental mass deletion."
                exit 1
              fi

              if [ -n "$DELETE_IDS" ] && [ "$DELETE_COUNT" -gt 0 ]; then
                echo "🗑️ Would delete $DELETE_COUNT versions"
                echo "$DELETE_IDS" | while read -r version_id; do
                  if [ -n "$version_id" ]; then
                    echo "🗑️ Would delete version: $version_id"
                    echo "DEBUG: Would run: gh api --method DELETE /orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions/$version_id"
                  fi
                done
              else
                echo "ℹ️ No versions to delete"
              fi

              # Ensure latest tag points to most recent promoted image
              if [ -n "$LATEST_SHA" ]; then
                echo "🏷️ Ensuring latest tag points to most recent promoted image ($LATEST_SHA)..."
                docker buildx imagetools create \
                  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$LATEST_SHA \
                  --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || echo "⚠️ WARNING: Failed to update latest tag"
              fi
            else
              echo "ℹ️ No promoted images found, skipping cleanup"
            fi

            # Final verification
            echo "✅ Final registry state:"
            gh api /orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions --jq '.[] | {id: .id, tags: .metadata.container.tags, created_at: .created_at}' | head -20
          else
            echo "ℹ️ Skipping cleanup - not a main branch push or tests/scan failed"
          fi