name: AI Assistant Container Software Update

on:
  workflow_dispatch:  # Allow manual triggering

# Security: Restrict workflow permissions to minimum required
permissions:
  contents: write
  packages: read
  pull-requests: write

jobs:
  update-software-versions:
    name: Update Software Versions with Claude Code
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.XPAI_HOUSEKEEPING_BOT_ID }}
          private-key: ${{ secrets.XPAI_HOUSEKEEPING_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Run Claude Code software version updates
        id: claude_updates
        uses: ./.github/actions/claude-automation
        with:
          script-content: |
            #!/bin/bash
            set -e
            echo "Starting Claude Code software version update process..."
            echo "Working directory: $(pwd)"
            echo "Target: ai-assistant-container/Dockerfile"
            echo "Running /update-software-versions command for ai-assistant-container/Dockerfile"
            claude -p "/update-software-versions ai-assistant-container/Dockerfile" --dangerously-skip-permissions
            echo "Claude Code software version update completed successfully"
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Check for changes and create PR
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Configure git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Check if there are any changes
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes detected after running software version updates"
            echo "::notice::No software version updates were needed"
            exit 0
          fi

          # Create a new branch for the updates
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="auto-update-software-versions-${TIMESTAMP}"
          git checkout -b "$BRANCH_NAME"

          # Stage all changes
          git add -A

          # Show what changed for debugging
          echo "Changes detected:"
          git diff --cached --name-only

          # Commit the changes
          git commit -m "Update AI assistant container software versions via Claude Code

          Automated software version updates performed using /update-software-versions command.
          Target: ai-assistant-container/Dockerfile

          🤖 Generated with [Claude Code](https://claude.ai/code)

          Co-Authored-By: Claude <noreply@anthropic.com>"

          # Push the branch
          git push origin "$BRANCH_NAME"

          # Create a pull request
          gh pr create \
            --title "Update AI assistant container software versions ($(date +%Y-%m-%d))" \
            --body "## Summary

          Automated software version updates performed using Claude Code's \`/update-software-versions\` command.

          **Target:** \`ai-assistant-container/Dockerfile\`
          **Triggered by:** Manual workflow dispatch
          **Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')

          🤖 Generated with [Claude Code](https://claude.ai/code)" \
            --base main \
            --head "$BRANCH_NAME"

      - name: Log completion
        if: always()
        run: |
          echo "✅ Workflow completed"
          if [ "${{ steps.claude_updates.outcome }}" = "success" ]; then
            echo "✅ Claude Code updates ran successfully"
            if [ -n "${{ env.PR_URL }}" ]; then
              echo "✅ Pull request created: ${{ env.PR_URL }}"
            else
              echo "ℹ️  No changes detected - no PR created"
            fi
          else
            echo "❌ Claude Code updates failed"
            echo "Check the workflow logs for details"
          fi
