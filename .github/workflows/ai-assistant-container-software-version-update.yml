name: AI Assistant Container Software Update

on:
  schedule:
    # Run every Wednesday at midnight Eastern Time (5:00 AM UTC)
    # Note: Using EST (UTC-5). During EDT (daylight saving), this runs at 1:00 AM ET
    - cron: '0 5 * * 3'
  workflow_dispatch:  # Allow manual triggering

# Security: Restrict workflow permissions to minimum required
permissions:
  contents: write
  packages: read
  pull-requests: write

jobs:
  update-software-versions:
    name: Update Software Versions with Claude Code
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.XPAI_HOUSEKEEPING_BOT_ID }}
          private-key: ${{ secrets.XPAI_HOUSEKEEPING_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull container image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/project-container:latest
        run: |
          echo "Pulling $IMAGE..."
          docker pull --platform linux/amd64 "$IMAGE"

      - name: Run Claude Code software version updates
        id: claude_updates
        env:
          IMAGE: ghcr.io/${{ github.repository }}/project-container:latest
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -e ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -v "$GITHUB_WORKSPACE":/workspaces/repo \
            --workdir /workspaces/repo \
            "$IMAGE" \
            /workspaces/repo/.github/scripts/update-software-versions.sh

      - name: Generate branch name and date
        id: branch-name
        run: |
          echo "name=software-versions-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Create automated PR
        uses: ./.github/actions/create-automated-pr
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pr-title: "Update AI assistant container software versions (${{ steps.branch-name.outputs.date }})"
          pr-body: |
            ## Summary

            Automated software version updates performed using Claude Code's `release-engineer-beta:update-versions` skill.

            🤖 Generated with [Claude Code](https://claude.ai/code)
          commit-message: |
            Update AI assistant container software versions via Claude Code

            Automated software version updates performed using release-engineer-beta:update-versions skill.
            Target: image/Dockerfile

            🤖 Generated with [Claude Code](https://claude.ai/code)

            Authored-By: Claude <noreply@anthropic.com>
          branch-name: ${{ steps.branch-name.outputs.name }}
