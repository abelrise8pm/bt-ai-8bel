version: '3.8'

# ============================================================================
# Container Naming
# ============================================================================
# Default names: cui-firewall-manager, cui-ai-assistant
# To rename (e.g., for multiple projects), edit the container_name fields below
# ============================================================================

services:
  # Firewall Manager Container
  # Prebuilt container with iptables and firewall script baked in
  # Provides network namespace shared by ai-assistant container
  firewall-manager:
    container_name: cui-firewall-manager
    # Prebuilt firewall manager image with baked-in dependencies
    # Digest is auto-updated by GitHub Actions on new builds
    image: ghcr.io/rise8-us/xpai/firewall-manager@sha256:4d564419acb5e2e516307f7d4f405e5c5ff2018f03bcec8272ec12c881f91937
    cap_add:
      - NET_ADMIN
      - SYS_TIME
    volumes:
      # Only whitelist needs to be mounted - everything else is baked into image
      - ../firewall/whitelist.txt:/firewall/whitelist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "iptables -L OUTPUT -n | grep -q 'policy DROP' && iptables -L OUTPUT -n | grep -q 'dpt:53'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # AI Assistant Container
  # Unprivileged container with no capabilities
  # Shares network namespace with firewall-manager
  ai-assistant:
    image: ghcr.io/rise8-us/xpai/ai-assistant-home@sha256:e002af395ba753a530311dc78f9c5fff5f6f9c25eaf92006ff260cc6abc0b8b7
    container_name: cui-ai-assistant
    network_mode: "service:firewall-manager"
    cap_drop:
      - ALL
    depends_on:
      firewall-manager:
        condition: service_healthy
    volumes:
      # Mount workspace (adjust path as needed)
      - ../:/workspace:cached
      # Persist Claude Code config (settings, history, init marker) across rebuilds
      # Replace "YOURPROJECT" with your project name (no spaces/dashes)
      - YOURPROJECT-claude-config:/home/aiAssistant/.claude
      # ========================================================================
      # PERFORMANCE OPTIMIZATION: Cache Persistence (Optional)
      # ========================================================================
      # Uncomment to persist caches across rebuilds. Define volumes below first.
      # Replace "YOURPROJECT" with your project name (no spaces/dashes).
      # ========================================================================
      # - YOURPROJECT-node-modules:/workspace/node_modules
      # - YOURPROJECT-npm-cache:/home/aiAssistant/.npm
      # - YOURPROJECT-pnpm-store:/home/aiAssistant/.local/share/pnpm
      # - YOURPROJECT-playwright:/home/aiAssistant/.cache/ms-playwright
      # - YOURPROJECT-pip-cache:/home/aiAssistant/.cache/pip
      # - YOURPROJECT-go-cache:/home/aiAssistant/go/pkg/mod
    working_dir: /workspace
    env_file:
      - ../.env.bedrock
      - ../.env
    restart: unless-stopped
    # Keep container running
    command: sleep infinity

# Claude Code config persistence
# Replace "YOURPROJECT" with your project name (no spaces/dashes)
volumes:
  YOURPROJECT-claude-config:

# ============================================================================
# PERFORMANCE OPTIMIZATION: Named Volumes (Optional)
# ============================================================================
# Uncomment to enable cache persistence. Replace "YOURPROJECT" with your
# project name, then uncomment corresponding mounts in ai-assistant.volumes.
# Add these under the 'volumes:' section above.
# ============================================================================
#   YOURPROJECT-node-modules:
#   YOURPROJECT-npm-cache:
#   YOURPROJECT-pnpm-store:
#   YOURPROJECT-playwright:
#   YOURPROJECT-pip-cache:
#   YOURPROJECT-go-cache:
